name: Validate SkillHub frontend

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["consolidate/new-skillhub-app"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
